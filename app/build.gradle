plugins { id 'com.android.application' }

def value = { key, fallback -> providers.gradleProperty(key).getOrElse(fallback) }
def quoted = { s -> '"' + s.replace('\\', '\\\\').replace('"', '\\"') + '"' }
if (value('useEmulators', 'true') == 'false') {
    ['firebaseProject', 'firebaseAppId', 'firebaseApiKey', 'firebaseUrl', 'firebaseSenderId'].each { key ->
        if (!providers.gradleProperty(key).isPresent()) throw new GradleException("Hosted builds require -P${key}; see README.")
    }
}

android {
    namespace 'com.example.sreer.geekspad'
    compileSdk 35
    defaultConfig {
        applicationId 'com.example.sreer.geekspad'
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName '2.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'FIREBASE_PROJECT', quoted(value('firebaseProject', 'demo-geekspad'))
        buildConfigField 'String', 'FIREBASE_APP_ID', quoted(value('firebaseAppId', '1:123456789:android:geekspaddemo'))
        buildConfigField 'String', 'FIREBASE_API_KEY', quoted(value('firebaseApiKey', 'demo-emulator-only-key'))
        buildConfigField 'String', 'FIREBASE_URL', quoted(value('firebaseUrl', 'https://demo-geekspad-default-rtdb.firebaseio.com'))
        buildConfigField 'String', 'FIREBASE_SENDER_ID', quoted(value('firebaseSenderId', '123456789'))
        buildConfigField 'String', 'EMULATOR_HOST', quoted(value('emulatorHost', '10.0.2.2'))
        buildConfigField 'boolean', 'USE_EMULATORS', value('useEmulators', 'true')
        resValue 'string', 'google_maps_key', value('mapsApiKey', '')
        manifestPlaceholders = [usesCleartextTraffic: value('useEmulators', 'true')]
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    testOptions { unitTests.returnDefaultValues = true }
    lint { abortOnError true; disable 'ExpiredTargetSdkVersion' }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.android.gms:play-services-maps:19.0.0'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
