name: Android and Firebase verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
      - run: npm ci && npm test
        working-directory: backend/functions
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: cd backend && npx firebase emulators:exec --project demo-geekspad --only auth,database 'node scripts/seed.mjs && cd .. && ./gradlew connectedDebugAndroidTest'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geekspad-apk-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
